<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="canonical" href="https://giraffe2257-tech.github.io/portfolio/" />
<title>Vivian Wang — Product Manager · Variant C · Balance</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600&family=Josefin+Sans:wght@100;200;300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
/* ===== Variant C — BALANCE shell + editorial kinetic home hero =====
   Massive Anton title reveals dead-centre, settles to the very top as a structural header,
   with a per-letter dual-layer slot-machine flip on hover (interruptible, expo easing).
   Below: subtitle + an infinite bottom marquee. Vanilla CSS/JS, no build step.
   Previous home heroes preserved as index-c.home*.backup.html */
body.vc{ --mono:"Space Mono",monospace; --paper:#000000; --paper2:#0B0B0B;
  --b1:#161616; --b2:#241c12; --b3:#121212; --b4:#1e1710; --blob-op:.7; --blob-blur:82px; }
body.vc[data-theme="fog"]{ --paper:#EBEAE4; --paper2:#E1DFD7; --ink:#16181A; --ink-soft:#6E6E66;
  --line:rgba(20,20,18,.16); --accent:#9C6B33; --accent-soft:rgba(156,107,51,.14);
  --glass:rgba(255,255,255,.5); --glass-line:rgba(20,20,18,.12);
  --b1:#dcd6c8; --b2:#e1d4c0; --b3:#d9d7cd; --b4:#e3d9cc; --blob-op:.5; }

.vc .hero.vhero{--hx:clamp(14px,2.4vw,34px);
  min-height:100vh;display:flex;flex-direction:column;position:relative;
  padding:clamp(54px,8vh,84px) var(--hx) 0;max-width:none;overflow:hidden}

/* corner metadata (top-left); nav lives top-right via the .nav-top sidebar */
.vc .vh-top{position:absolute;top:clamp(18px,3.4vh,30px);left:var(--hx);z-index:4;
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);
  opacity:0;transform:translateY(20px);animation:vhUiIn .8s cubic-bezier(.16,.8,.3,1) forwards .15s}
.vc .vh-top .avail{display:flex;align-items:center;gap:8px;color:var(--accent)}
.vc .vh-top .avail::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 0 var(--accent);animation:pulse 2.4s infinite}

/* ===== massive title: reveals centred (--cy), settles to the top ===== */
.vc .vh-head{transform:translateY(var(--cy,34vh));transition:transform 1.1s cubic-bezier(.16,1,.3,1);
  will-change:transform}
body.vc.vh-settled .vh-head{transform:translateY(0)}
.vc .vh-name{font-family:"Anton",sans-serif;font-weight:400;
  font-size:clamp(2.6rem,14vw,18rem);line-height:.9;letter-spacing:.02em;text-transform:uppercase;
  color:var(--ink);margin:0;white-space:nowrap;text-align:center;cursor:default;width:100%}

/* split letters: HORIZONTAL entrance wipe (.ltr-up) + side-by-side roll-left flip on hover (.ltr-roll) */
.vc .split{display:inline-block}
.vc .ltr{position:relative;display:inline-block;overflow:hidden;vertical-align:top;height:1em;line-height:1}
.vc .ltr-up{display:block;transform:translateX(115%);
  animation:vhLtrIn 1.30s cubic-bezier(.215,.61,.355,1) both;animation-delay:calc(var(--i)*.09s + .2s)}
.vc .ltr-roll{position:relative;display:inline-block;white-space:nowrap;will-change:transform;
  transform:translateX(0);transition:transform 0s}   /* leave: snap back instantly & invisibly (twin≡original) → only the hovered letter ever visibly moves */
.vc .ltr-roll > span{display:inline-block;height:1em;line-height:1}
.vc .ltr-roll > span + span{position:absolute;left:100%;top:0}   /* twin sits just to the right, clipped by the mask */
/* hover: ONLY the letter under the cursor rolls, always leftward; on leave it resets with no reverse animation */
.vc .ltr:hover .ltr-roll{transform:translateX(-100%);transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.vc .ltr-sp{display:inline-block;width:.16em}
@keyframes vhLtrIn{to{transform:translateX(0)}}
@keyframes vhUiIn{to{opacity:1;transform:none}}

/* ===== mid: eyebrow + subtitle, centred in the space under the settled title ===== */
.vc .vh-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  gap:clamp(13px,2.4vh,26px);padding:clamp(20px,4vh,50px) var(--hx) clamp(70px,12vh,130px)}
.vc .vh-eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);
  opacity:0;transition:opacity .8s ease}
.vc .vh-sub{font-family:var(--mono);font-weight:700;font-size:clamp(.95rem,2.1vw,1.5rem);letter-spacing:.36em;
  text-transform:uppercase;color:var(--ink-soft);padding-left:.36em;opacity:0;transition:opacity .8s ease}
.vc .vh-sub b{color:var(--accent);font-weight:700}
body.vc.vh-settled .vh-eyebrow{opacity:1;transition-delay:.5s}
body.vc.vh-settled .vh-sub{opacity:1;transition-delay:.62s}

/* bottom-centre scroll indicator (sits just above the marquee) */
.vc .vh-scroll{position:absolute;left:50%;bottom:clamp(82px,13vh,140px);transform:translateX(-50%);z-index:4;
  display:flex;flex-direction:column;align-items:center;gap:9px;
  font-family:var(--mono);font-size:.56rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-soft);
  opacity:0;transition:opacity .8s ease}
body.vc.vh-settled .vh-scroll{opacity:1;transition-delay:.7s}
.vc .vh-scroll .ln{width:1px;height:34px;background:linear-gradient(var(--ink-soft),transparent);position:relative;overflow:hidden}
.vc .vh-scroll .ln::after{content:"";position:absolute;top:-45%;left:0;width:1px;height:45%;background:var(--accent);
  animation:vhScrollLn 1.8s cubic-bezier(.7,0,.3,1) infinite}
@keyframes vhScrollLn{0%{top:-45%}60%,100%{top:100%}}

/* ===== infinite bottom marquee (speed responds to scroll velocity) ===== */
.vc .vh-marquee{margin:0 calc(-1*var(--hx));border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  overflow:hidden;white-space:nowrap;padding:15px 0;opacity:0;transition:opacity .9s ease}
body.vc.vh-settled .vh-marquee{opacity:1;transition-delay:.78s}
.vc .vh-mq-track{display:inline-block;will-change:transform}
.vc .vh-mq-item{display:inline-block;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;
  font-size:clamp(1rem,2vw,1.7rem);letter-spacing:.01em;text-transform:uppercase;color:var(--ink);
  padding:0 .1em;transition:color .3s,letter-spacing .3s}
.vc .vh-mq-item .sep{color:var(--accent);margin:0 .7em;font-size:.7em;vertical-align:.12em}
.vc .vh-mq-item:hover{color:var(--accent);letter-spacing:.06em}

/* home: nav top-right; reverts to the left sidebar once scrolled to About */
.sidebar{transition:opacity .3s ease}
@media(min-width:881px){
  body.vc.nav-top .sidebar{top:24px;left:auto;right:84px;bottom:auto;width:auto;height:auto;
    flex-direction:row;align-items:center;gap:clamp(14px,1.8vw,26px);background:none;border:none;padding:0}
  body.vc.nav-top .snav{flex-direction:row;gap:clamp(14px,1.8vw,24px);margin:0}
  body.vc.nav-top .snav a{padding:4px 0;font-size:.82rem}
  body.vc.nav-top .snav a i{display:none}
  body.vc.nav-top .snav a::after{bottom:-2px}
  body.vc.nav-top .snav a:hover::after,body.vc.nav-top .snav a.cur::after{width:100%}
  body.vc.nav-top .socials{display:none}
  body.vc.nav-top.has-sidebar .hero.vhero{margin-left:0}
}

@media(max-width:880px){
  .vc .hero.vhero{padding-top:74px}
  .vc .vh-name{font-size:clamp(2.4rem,15vw,6rem)}
  .vc .vh-sub{letter-spacing:.3em}
}
@media(prefers-reduced-motion:reduce){
  .vc .ltr-up,.vc .vh-top,.vc .vh-eyebrow,.vc .vh-sub,.vc .vh-scroll,.vc .vh-marquee{animation:none!important;opacity:1!important;transform:none!important}
  .vc .vh-head{transform:none!important}
  /* fix #3: never leave reveal-gated content invisible for reduced-motion users */
  .r{opacity:1!important;transform:none!important}
}
</style>
</head>
<body data-page="home" class="vc">

<section class="hero vhero">
  <div class="vh-top">
    <span class="avail" data-i18n="hero.avail">Open to 2026 roles</span>
    <span data-i18n="hero.loc">London, UK</span>
  </div>

  <div class="vh-head">
    <h1 class="vh-name split" data-split>Vivian Wang</h1>
  </div>

  <div class="vh-mid">
    <div class="vh-eyebrow" data-i18n="hero.eyebrow">Portfolio · 2026</div>
    <div class="vh-sub" data-i18n-html="hero.sub">Product <b>×</b> AI Systems</div>
  </div>

  <div class="vh-scroll">
    <span data-i18n="hero.scroll">Scroll Down</span>
    <span class="ln"></span>
  </div>

  <div class="vh-marquee" aria-hidden="true">
    <div class="vh-mq-track" id="vhTrack">
      <span class="vh-mq-item"><span data-i18n="mq.1">Product thinking</span><span class="sep">✦</span></span><span class="vh-mq-item"><span data-i18n="mq.2">AI engineering</span><span class="sep">✦</span></span><span class="vh-mq-item"><span data-i18n="mq.3">Systems that ship</span><span class="sep">✦</span></span><span class="vh-mq-item"><span data-i18n="mq.4">From prompting to production</span><span class="sep">✦</span></span><span class="vh-mq-item"><span data-i18n="mq.5">DeFi · Live-streaming · Research</span><span class="sep">✦</span></span><span class="vh-mq-item"><span data-i18n="mq.6">Trilingual PM</span><span class="sep">✦</span></span>
    </div>
  </div>
</section>

<script>
/* hero choreography: own everything, keep app.js from double-revealing the hero */
(function(){
  var hero=document.querySelector('.hero.vhero');
  if(hero) hero.dataset.rev='1';   // app.js reveal() will skip this section

  /* split-text: entrance clip reveal + dual-layer slot-machine flip on hover (per letter) */
  document.querySelectorAll('[data-split]').forEach(function(el){
    var text=el.textContent; el.textContent=''; var i=0;
    [].forEach.call(text, function(ch){
      if(ch===' '){ var sp=document.createElement('span'); sp.className='ltr-sp'; el.appendChild(sp); return; }
      var o=document.createElement('span'); o.className='ltr';
      var up=document.createElement('span'); up.className='ltr-up'; up.style.setProperty('--i', i);
      var roll=document.createElement('span'); roll.className='ltr-roll';
      var a=document.createElement('span'); a.textContent=ch;   // layer A (default)
      var b=document.createElement('span'); b.textContent=ch;   // layer B (clone, below)
      roll.appendChild(a); roll.appendChild(b); up.appendChild(roll); o.appendChild(up); el.appendChild(o);
      i++;
    });
  });

  /* measure the centre offset (no transition while measuring), then settle to the top */
  var head=document.querySelector('.vh-head');
  function setCenter(){
    if(!head || document.body.classList.contains('vh-settled')) return;
    var prev=head.style.transition; head.style.transition='none';
    head.style.setProperty('--cy','0px');
    var r=head.getBoundingClientRect();
    var cy=Math.max(0,(window.innerHeight - r.height)/2 - r.top);
    head.style.setProperty('--cy', cy+'px');
    void head.offsetWidth;
    head.style.transition=prev||'';
  }
  requestAnimationFrame(setCenter);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(setCenter);
  setTimeout(function(){ document.body.classList.add('vh-settled'); }, 1700);   // after letters finish revealing

  /* infinite marquee, speed responds to scroll velocity */
  var track=document.getElementById('vhTrack');
  if(track){
    track.innerHTML += track.innerHTML;
    var halfW=0, x=0, base=0.55, boost=0, paused=false;
    function measure(){ halfW=track.scrollWidth/2; }
    measure();
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
    window.addEventListener('resize', measure);
    var mq=track.parentElement;
    mq.addEventListener('mouseenter', function(){ paused=true; });
    mq.addEventListener('mouseleave', function(){ paused=false; });
    window.addEventListener('wheel', function(e){ boost=Math.max(-10,Math.min(10, boost + e.deltaY*0.02)); }, {passive:true});
    function frame(){
      if(!paused){ x -= (base + Math.abs(boost)); if(halfW && -x>=halfW) x+=halfW; track.style.transform='translateX('+x+'px)'; }
      boost*=0.9;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* nav: top-right while the home hero is in view, back to the left sidebar past it */
  function navScroll(){
    var h=(document.getElementById('home')||hero); if(!h) return;
    if(window.scrollY < h.offsetHeight - 130) document.body.classList.add('nav-top');
    else document.body.classList.remove('nav-top');
  }
  document.body.classList.add('nav-top');
  window.addEventListener('scroll', navScroll, {passive:true});
  window.addEventListener('resize', navScroll);
  setTimeout(navScroll, 0);
})();
</script>

<script src="cases.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>

</body>
</html>
